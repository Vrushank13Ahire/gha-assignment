name: Q2 Release Notes
on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-22.04]
        node: [18, 20]
        exclude:
          - os: ubuntu-22.04
            node: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node Setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Print Versions
        run: |
          npm --version
          node --version

      - name: Write Report
        run: |
          mkdir -p out
          echo "Runner OS: $RUNNER_OS">out/report-${{ matrix.os }}-${{ matrix.node }}.txt
          
        
