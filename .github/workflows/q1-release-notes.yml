name: CI

on:
  workflow_dispatch: 
    inputs:
      version:
        type: string
        default: "1.0.0"
        required: true

      release_type:
        type: choice
        options: [ patch, minor, major ]
        default: "patch"


jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "{{ inputs.version }}"
      - run: echo "{{ inputs.release_type }}"
      - run: echo "{{ inputs.run_number }}"
      - run: echo "Build date:=$(date +%F)" >> "$Build_Date"




      
