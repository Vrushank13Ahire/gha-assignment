name: CI

on:
  workflow_dispatch: 
    inputs:
      version:
        type: string
        default: "1.0.0"
        required: true

      release_type:
        type: choice
        options: [ patch, minor, major ]
        default: "patch"


jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: date
      
